name: Build desktop apps

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version to build, for example 1.2.3
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # 只构建 Windows x64 与 macOS Apple Silicon。
        # 平台集合以这里为唯一来源：清单脚本按产物目录是否存在决定平台列表，
        # 因此重新支持某个平台只需恢复对应条目，无需改动任何脚本。
        include:
          - name: Windows x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            artifact: bframe-studio-windows-x64
            bundles: nsis
            media_arch: x64
            upload_path: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
          - name: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            artifact: bframe-studio-macos-arm64
            updater_arch: arm64
            bundles: app,dmg
            media_arch: arm64
            upload_path: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.sig

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev espeak-ng

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        env:
          npm_config_arch: ${{ matrix.media_arch }}
        run: npm ci

      - name: Install Windows ARM64 FFprobe compatibility package
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/ffprobe-compat" --no-save --package-lock=false --ignore-scripts --force @ffprobe-installer/win32-x64@5.1.0
          echo "BVIDEO_SIDECAR_FFPROBE=$RUNNER_TEMP/ffprobe-compat/node_modules/@ffprobe-installer/win32-x64/ffprobe.exe" >> "$GITHUB_ENV"

      - name: Validate bundled media tools
        env:
          npm_config_arch: ${{ matrix.media_arch }}
        run: npm run prepare:media-sidecars

      - name: Prepare signed updater configuration
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
          VITE_ENABLE_UPDATER: ${{ vars.VITE_ENABLE_UPDATER == 'true' && 'true' || 'false' }}
          VITE_LICENSE_SERVER_URL: ${{ vars.VITE_LICENSE_SERVER_URL }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY || secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: node scripts/write-tauri-release-config.mjs

      - name: Import Apple Developer certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "Missing APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, or APPLE_SIGNING_IDENTITY" >&2
            exit 1
          fi

          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/bframe-studio-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"

          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A -out "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 7200 "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path"

          if ! security find-identity -v -p codesigning "$keychain_path" | grep -F "$APPLE_SIGNING_IDENTITY"; then
            echo "APPLE_SIGNING_IDENTITY does not match the imported certificate" >&2
            exit 1
          fi

      - name: Prepare App Store Connect API key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ vars.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_API_ISSUER" ] || [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            echo "Missing APPLE_API_ISSUER, APPLE_API_KEY, or APPLE_API_KEY_P8" >&2
            exit 1
          fi

          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_P8" | openssl base64 -d -A -out "$api_key_path"
          chmod 600 "$api_key_path"
          echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"

      - name: Build Windows bundles
        if: runner.os == 'Windows'
        shell: bash
        env:
          VITE_ENABLE_UPDATER: ${{ vars.VITE_ENABLE_UPDATER == 'true' && 'true' || 'false' }}
          VITE_LICENSE_SERVER_URL: ${{ vars.VITE_LICENSE_SERVER_URL }}
          VITE_LICENSE_RESPONSE_KEY: ${{ vars.VITE_LICENSE_RESPONSE_KEY || secrets.VITE_LICENSE_RESPONSE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config "$RUNNER_TEMP/bframe-studio-release/tauri.release.conf.json"

      - name: Build Linux bundles
        if: runner.os == 'Linux'
        shell: bash
        env:
          VITE_ENABLE_UPDATER: ${{ vars.VITE_ENABLE_UPDATER == 'true' && 'true' || 'false' }}
          VITE_LICENSE_SERVER_URL: ${{ vars.VITE_LICENSE_SERVER_URL }}
          VITE_LICENSE_RESPONSE_KEY: ${{ vars.VITE_LICENSE_RESPONSE_KEY || secrets.VITE_LICENSE_RESPONSE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config "$RUNNER_TEMP/bframe-studio-release/tauri.release.conf.json"

      - name: Prepare Linux updater
        if: runner.os == 'Linux'
        env:
          LINUX_UPDATER_DIRECTORY: src-tauri/target/${{ matrix.target }}/release/bundle/appimage
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/prepare-linux-updater.mjs

      - name: Build signed and notarized macOS bundles
        if: runner.os == 'macOS'
        shell: bash
        env:
          VITE_ENABLE_UPDATER: ${{ vars.VITE_ENABLE_UPDATER == 'true' && 'true' || 'false' }}
          VITE_LICENSE_SERVER_URL: ${{ vars.VITE_LICENSE_SERVER_URL }}
          VITE_LICENSE_RESPONSE_KEY: ${{ vars.VITE_LICENSE_RESPONSE_KEY || secrets.VITE_LICENSE_RESPONSE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ vars.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config "$RUNNER_TEMP/bframe-studio-release/tauri.release.conf.json"

      - name: Add architecture suffix to macOS updater
        if: runner.os == 'macOS'
        shell: bash
        env:
          UPDATER_ARCH: ${{ matrix.updater_arch }}
          UPDATER_DIRECTORY: src-tauri/target/${{ matrix.target }}/release/bundle/macos
        run: |
          shopt -s nullglob
          updater_files=("$UPDATER_DIRECTORY"/*.app.tar.gz)
          if [ "${#updater_files[@]}" -ne 1 ]; then
            echo "Expected exactly one macOS updater, found ${#updater_files[@]}" >&2
            find "$UPDATER_DIRECTORY" -maxdepth 1 -type f -print >&2
            exit 1
          fi

          updater_path="${updater_files[0]}"
          signature_path="${updater_path}.sig"
          if [ ! -s "$signature_path" ]; then
            echo "Missing or empty updater signature: $signature_path" >&2
            exit 1
          fi

          renamed_updater="${updater_path%.app.tar.gz}_${UPDATER_ARCH}.app.tar.gz"
          renamed_signature="${renamed_updater}.sig"
          if [ -e "$renamed_updater" ] || [ -e "$renamed_signature" ]; then
            echo "Architecture-specific updater already exists" >&2
            exit 1
          fi

          mv "$updater_path" "$renamed_updater"
          mv "$signature_path" "$renamed_signature"
          echo "Prepared $(basename "$renamed_updater")"

      - name: Upload desktop bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.upload_path }}
          if-no-files-found: error
          retention-days: 14

  prepare-release:
    name: Prepare desktop release manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download desktop bundles
        uses: actions/download-artifact@v4
        with:
          pattern: bframe-studio-*
          path: release-artifacts

      - name: Resolve release asset base URL
        id: asset-base
        env:
          CONFIGURED_ASSET_BASE_URL: ${{ vars.RELEASE_ASSET_BASE_URL }}
          RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$CONFIGURED_ASSET_BASE_URL" ]; then
            echo "RELEASE_ASSET_BASE_URL 未配置，产物地址回退到 GitHub Release。" >&2
            exit 0
          fi

          # 应用名取自 package.json 的 name（小写连字符 slug，适合做路径段）。
          # 不用 tauri.conf.json 的 productName——它含空格，放进 URL 会被编码成 %20。
          app_slug="$(node -p "require('./package.json').name" 2>/dev/null || true)"
          if [ -z "$app_slug" ]; then
            echo "无法从 package.json 读取应用名，拒绝猜测产物路径" >&2
            exit 1
          fi

          version="${RELEASE_VERSION#v}"
          # 路径层级：/{应用名}/releases/v{版本}/。下载域名可能同时托管多个应用，
          # 用应用名分子目录隔离；版本号进路径后回滚时旧产物仍在，重跑同版本只覆盖同一前缀。
          echo "baseUrl=${CONFIGURED_ASSET_BASE_URL%/}/${app_slug}/releases/v${version}" >> "$GITHUB_OUTPUT"
          echo "objectPrefix=${app_slug}/releases/v${version}" >> "$GITHUB_OUTPUT"

      - name: Validate bundles and create desktop release manifest
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
          RELEASE_ARTIFACTS_DIR: release-artifacts
          RELEASE_MANIFEST_PATH: release-manifest/desktop-release-manifest.json
          PUBLISH_GITHUB_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
          RELEASE_ASSET_BASE_URL: ${{ steps.asset-base.outputs.baseUrl }}
        run: node scripts/build-desktop-release-manifest.mjs

      - name: Install ossutil
        if: steps.asset-base.outputs.baseUrl != ''
        env:
          OSSUTIL_VERSION: "2.3.0"
          OSSUTIL_SHA256: "3ae4d9fc85a7a6e9f5654d1599766f1a3a42a3692870887b5ae9338d582ef65a"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ossutil.zip"
          curl -fsSL -o "$archive" \
            "https://gosspublic.alicdn.com/ossutil/v2/${OSSUTIL_VERSION}/ossutil-${OSSUTIL_VERSION}-linux-amd64.zip"
          echo "${OSSUTIL_SHA256}  ${archive}" | sha256sum -c -
          # 官方 zip 内带一层 ossutil-<版本>-linux-amd64/ 目录，用 -j 丢弃路径直接解到目标目录。
          # 不加 -j 会解成 ossutil-bin/ossutil-2.3.0-linux-amd64/ossutil，后续 chmod 找不到文件。
          unzip -j -q -o "$archive" -d "$RUNNER_TEMP/ossutil-bin"
          if [ ! -f "$RUNNER_TEMP/ossutil-bin/ossutil" ]; then
            echo "解压后未找到 ossutil，压缩包结构可能已变，实际内容：" >&2
            unzip -l "$archive" >&2
            exit 1
          fi
          chmod 0755 "$RUNNER_TEMP/ossutil-bin/ossutil"
          echo "$RUNNER_TEMP/ossutil-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ossutil-bin/ossutil" version

      - name: Upload release assets to Aliyun OSS
        if: steps.asset-base.outputs.baseUrl != ''
        env:
          OSS_REGION: ${{ vars.OSS_REGION }}
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OBJECT_PREFIX: ${{ steps.asset-base.outputs.objectPrefix }}
          RELEASE_ARTIFACTS_DIR: release-artifacts
        run: |
          set -euo pipefail
          for name in OSS_REGION OSS_ENDPOINT OSS_BUCKET OSS_ACCESS_KEY_ID OSS_ACCESS_KEY_SECRET; do
            if [ -z "${!name}" ]; then
              echo "RELEASE_ASSET_BASE_URL 已配置，但缺少 $name" >&2
              exit 1
            fi
          done

          # 对象键必须与清单里的 fileName 逐一对应：按平台分了目录，这里扁平化后再上传。
          # 文件名唯一性已由上一步的清单校验保证，扁平化不会互相覆盖。
          staging="$RUNNER_TEMP/oss-staging"
          mkdir -p "$staging"
          find "$RELEASE_ARTIFACTS_DIR" -type f -exec cp -p {} "$staging/" \;

          shopt -s nullglob
          files=("$staging"/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "暂存目录为空，没有可上传的产物" >&2
            exit 1
          fi
          echo "待上传 ${#files[@]} 个产物："
          printf '  %s\n' "${files[@]##*/}"

          # 逐文件上传，刻意不用 `cp -r` 批量模式：批量模式下单个文件失败只会被记进 report
          # 再继续，job 依旧成功，产物就静默漏传了（ossutil 2.x 没有 1.x 的
          # --disable-ignore-error，而 --no-error-report 只关报告、不改变退出码语义）。
          # 单文件 cp 不进入批量迭代，失败会直接以非零码退出，配合 set -e 让 job 失败。
          # 只用 oss:PutObject，无需为「上传后再列一遍」额外开放 oss:ListObjects。
          for file in "${files[@]}"; do
            name="${file##*/}"
            echo "上传 ${name}"
            ossutil cp "$file" "oss://${OSS_BUCKET}/${OBJECT_PREFIX}/${name}" \
              --region "$OSS_REGION" \
              -e "$OSS_ENDPOINT" \
              -i "$OSS_ACCESS_KEY_ID" \
              -k "$OSS_ACCESS_KEY_SECRET" \
              -f
          done

      - name: Upload desktop release manifest
        uses: actions/upload-artifact@v4
        with:
          name: bframe-studio-desktop-release-manifest
          path: release-manifest/desktop-release-manifest.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop bundles
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' release_files < <(find release-artifacts -type f -print0)
          if [ "${#release_files[@]}" -eq 0 ]; then
            echo "No release files found" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${release_files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "${release_files[@]}" \
              --generate-notes \
              --title "BFrame Studio $GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY"
          fi

  publish-esa-release:
    name: Publish desktop release to ESA
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [prepare-release, release]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download desktop release manifest
        uses: actions/download-artifact@v4
        with:
          name: bframe-studio-desktop-release-manifest
          path: release-manifest

      - name: Publish desktop release to ESA EdgeKV
        env:
          ESA_KV_NAMESPACE: ${{ vars.ESA_KV_NAMESPACE }}
          ESA_ACCESS_KEY_ID: ${{ secrets.ESA_ACCESS_KEY_ID }}
          ESA_ACCESS_KEY_SECRET: ${{ secrets.ESA_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          for name in ESA_KV_NAMESPACE ESA_ACCESS_KEY_ID ESA_ACCESS_KEY_SECRET; do
            if [ -z "${!name}" ]; then
              echo "自动发布 ESA 缺少 $name" >&2
              exit 1
            fi
          done

          node scripts/import-desktop-release.mjs \
            --manifest release-manifest/desktop-release-manifest.json \
            --namespace "$ESA_KV_NAMESPACE"
